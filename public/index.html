<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f36b21">
    <title>UDAAN</title>
    <link rel="stylesheet" href="style.css?v=login-final-1">
</head>

<body class="auth-page">

<div class="auth-app">

    <div class="auth-brand">
        <div class="auth-logo">UDAAN <span>🚀</span></div>
        <div class="auth-tagline">Jahan Har Creator Udaan Bhare</div>
    </div>

    <div class="auth-card">

        <div class="auth-heading">
            <span class="auth-kicker">WELCOME BACK</span>
            <h1 id="title">Login</h1>
            <p>Continue your creator journey</p>
        </div>

        <form id="authForm" autocomplete="on">

            <!-- Signup-only existing field -->
            <div id="nameBox" class="field-wrap hidden">
                <span class="field-icon">👤</span>
                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    autocomplete="name"
                >
            </div>

            <!-- Username -->
            <div class="field-wrap">
                <span class="field-icon">👤</span>
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="field-wrap">
                <span class="field-icon">🔒</span>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- Mobile: UI field only, no OTP -->
            <div class="field-wrap mobile-field">
                <span class="field-icon">📱</span>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Mobile Number"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="15"
                >
            </div>

            <!-- Existing signup email -->
            <div id="emailBox" class="field-wrap hidden">
                <span class="field-icon">✉️</span>
                <input
                    type="email"
                    id="email"
                    placeholder="Gmail / Email Address"
                    autocomplete="email"
                >
            </div>

            <!-- Existing signup country -->
            <div id="countryBox" class="field-wrap hidden">
                <span class="field-icon">🌍</span>
                <select id="country">
                    <option value="">Select Country</option>
                    <option value="IN">India</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="AE">United Arab Emirates</option>
                    <option value="SG">Singapore</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="auth-submit">
                Login <span>→</span>
            </button>

        </form>

        <p id="message" class="auth-message"></p>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <div class="switch">
            <span id="switchText">New to UDAAN?</span>
            <button type="button" id="switchBtn">
                Create Account <span>→</span>
            </button>
        </div>

        <div class="otp-note">
            <span>🛡️</span>
            <span>No OTP will be sent. Mobile number is only an account detail.</span>
        </div>

    </div>

    <div class="auth-footer">
        UDAAN • Jahan Har Creator Udaan Bhare 🚀
    </div>

</div>

<script src="app.js?v=login-final-1"></script>
</body>
</html>
