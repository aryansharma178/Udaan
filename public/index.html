<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDAAN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="logo">UDAAN</div>
    <div class="tagline">Jahan Har Creator Udaan Bhare 🚀</div>

    <div class="card">

        <h2 id="title">Login</h2>

        <form id="authForm">

            <div id="nameBox" class="hidden">
                <input type="text" id="name" placeholder="Full Name">
            </div>

            <div id="emailBox" class="hidden">
                <input type="email" id="email" placeholder="Email Address">
            </div>

            <div id="countryBox" class="hidden">
                <select id="country">
                    <option value="">Select Country</option>
                    <option value="IN">India</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="AE">United Arab Emirates</option>
                    <option value="SG">Singapore</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <input type="text" id="username" placeholder="Username" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" id="submitBtn">Login</button>

        </form>

        <p id="message"></p>

        <div class="switch">
            <span id="switchText">New to UDAAN?</span>
            <button type="button" id="switchBtn">Create Account</button>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
