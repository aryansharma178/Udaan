<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDAAN - Go Live</title>
    <link rel="stylesheet" href="live.css">
</head>

<body>

<header class="live-header">
    <button id="backBtn" type="button">←</button>
    <h2>🔴 Go Live</h2>
</header>

<main>

    <section id="setupPanel" class="panel">

        <h1>Start your live</h1>

        <p>
            Connect with your UDAAN audience in real time.
        </p>

        <label>Live Title</label>

        <input
            id="liveTitle"
            type="text"
            maxlength="100"
            placeholder="Enter your live title"
        >

        <button
            id="startLiveBtn"
            class="primary"
            type="button"
        >
            🔴 Start Live
        </button>

        <p id="setupMessage"></p>

    </section>


    <section id="livePanel" class="live-fullscreen hidden">

        <div class="live-video-area">

            <video
                id="livePreview"
                autoplay
                muted
                playsinline
            ></video>

            <div class="live-top-overlay">

                <span class="live-badge">
                    🔴 LIVE
                </span>

                <span id="liveTitleDisplay">
                    UDAAN Live
                </span>

                <span class="viewer-count">
                    👁 <span id="viewerCount">0</span>
                </span>

            </div>


            <div class="camera-switch">

                <select id="cameraSelect">

                    <option value="user">
                        🤳 Front
                    </option>

                    <option value="environment">
                        📷 Back
                    </option>

                </select>

            </div>


            <div class="fullscreen-controls">

                <button
                    id="switchCameraBtn"
                    type="button"
                >
                    🔄
                </button>

                <button
                    id="muteBtn"
                    type="button"
                >
                    🎙️
                </button>

                <button
                    id="fullscreenBtn"
                    type="button"
                >
                    ⛶
                </button>

                <button
                    id="endLiveBtn"
                    class="end-live"
                    type="button"
                >
                    ⏹ End Live
                </button>

            </div>

        </div>


        <section class="chat">

            <h3>💬 Live Chat</h3>

            <div id="chatList"></div>

            <div class="chat-input">

                <input
                    id="chatInput"
                    type="text"
                    maxlength="500"
                    placeholder="Say something..."
                >

                <button
                    id="sendChatBtn"
                    type="button"
                >
                    ➤
                </button>

            </div>

        </section>

    </section>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="live.js"></script>

</body>
</html>
