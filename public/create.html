<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UDAAN - Create</title>
    <link rel="stylesheet" href="/create.css">
</head>

<body>

<div class="creator-camera">

    <!-- TOP -->
    <div class="top-bar">
        <button class="icon-btn close-btn" onclick="history.back()">✕</button>

        <button class="sound-btn" id="soundBtn">
            ♪ <span>Add sound</span>
        </button>

        <button class="icon-btn" id="aiBtn">✦</button>
    </div>

    <!-- CAMERA -->
    <main class="camera-stage">

        <video id="cameraPreview" autoplay muted playsinline></video>

        <div id="cameraMessage" class="camera-message">
            Camera starting...
        </div>

        <div id="recordingBadge" class="recording-badge hidden">
            <span>●</span> REC
            <strong id="timer">00:00</strong>
        </div>

        <!-- RIGHT TOOLS -->
        <div class="right-tools">

            <button class="tool-btn" id="switchCameraBtn">
                <span>↻</span>
                <small>Camera</small>
            </button>

            <button class="tool-btn" id="timerBtn">
                <span>◷</span>
                <small>Timer</small>
            </button>

            <button class="tool-btn" id="durationBtn">
                <strong>15s</strong>
            </button>

            <button class="tool-btn" id="effectsBtn">
                <span>✦</span>
                <small>Effects</small>
            </button>

            <button class="tool-btn" id="zoomBtn">
                <strong>1x</strong>
            </button>

            <button class="tool-btn" id="cameraFocusBtn">
                <span>▣</span>
                <small>Camera</small>
            </button>

            <button class="tool-btn more-btn" id="moreBtn">
                <span>⌄</span>
            </button>

        </div>

        <!-- ADD MEDIA -->
        <button class="add-media" id="addMediaBtn">
            <div class="add-thumb">＋</div>
            <span>Add</span>
        </button>

        <!-- BOTTOM -->
        <div class="bottom-area">

            <div class="record-row">

                <button class="record-btn" id="recordBtn">
                    <span></span>
                </button>

            </div>

            <div class="mode-nav">

                <button class="mode-btn" data-mode="video">
                    Video
                </button>

                <button class="mode-btn" data-mode="short">
                    Short
                </button>

                <button class="mode-btn active" data-mode="live">
                    Live
                </button>

                <button class="mode-btn" data-mode="post">
                    Post
                </button>

            </div>

        </div>

    </main>

</div>

<!-- RECORDED VIDEO -->
<section id="recordedPreview" class="recorded-preview hidden">

    <div class="preview-header">
        <button id="closeRecordedBtn">✕</button>
        <h2>Preview</h2>
    </div>

    <video id="recordedVideo" controls playsinline></video>

    <button id="publishBtn">
        Continue to Publish
    </button>

</section>

<script src="/create.js"></script>

</body>
</html>
